<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>ژتون {{ token.token_code }}</title>
  <style>
    body { font-family: Tahoma, sans-serif; margin: 0; padding: 16px; }
    .ticket {
      width: 320px; margin: 0 auto; border: 2px dashed #0e9bd7; border-radius: 12px;
      padding: 16px; text-align: center;
    }
    .brand { font-weight: bold; font-size: 20px; color: #2d2d2d; }
    .brand .ac { color: #0e9bd7; direction: ltr; }
    .title { color: #0a78a8; margin: 6px 0 12px; font-size: 14px; }
    .code { font-family: Consolas, monospace; font-size: 22px; letter-spacing: 2px;
            direction: ltr; margin: 8px 0; }
    .row { display: flex; justify-content: space-between; font-size: 13px;
           padding: 3px 0; border-bottom: 1px dotted #ccc; }
    .qr { margin: 12px auto; width: 160px; height: 160px; }
    .qr svg { width: 100%; height: 100%; }
    .foot { margin-top: 10px; font-size: 11px; color: #888; }
    .actions { text-align: center; margin: 16px; }
    .btn { background: #0e9bd7; color: #fff; border: none; padding: 8px 16px;
           border-radius: 6px; cursor: pointer; font-family: inherit; }
    @media print { .actions { display: none; } body { padding: 0; } }
  </style>
</head>
<body>
  <div class="ticket">
    <div class="brand">win<span class="ac">ac</span> | ویناک</div>
    <div class="title">ژتون غذای روزانه</div>
    <div class="qr">{{ qr_svg }}</div>
    <div class="code">{{ token.token_code }}</div>
    <div class="row"><span>گیرنده</span><span>{{ token.recipient_name }}</span></div>
    <div class="row"><span>نوع</span><span>{{ token.get_recipient_type_display }}</span></div>
    <div class="row"><span>تاریخ</span><span>{{ token.date }}</span></div>
    <div class="row"><span>وضعیت</span><span>{{ token.get_status_display }}</span></div>
    <div class="foot">این ژتون فقط برای همان روز و یک‌بار مصرف معتبر است.</div>
  </div>
  <div class="actions">
    <button class="btn" onclick="window.print()">چاپ ژتون</button>
  </div>
</body>
</html>
